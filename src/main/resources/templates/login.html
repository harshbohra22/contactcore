<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">

<head>
  <title>Login</title>
</head>

<body>
  <div id="content">
    <style>
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
      }

      .dark .glass-card {
        background: rgba(17, 24, 39, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      .auth-input {
        transition: all 0.3s ease;
      }

      .auth-input:focus {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
    </style>

    <div class="min-h-[calc(100vh-4rem)] flex items-center justify-center p-4">

      <div class="w-full max-w-md glass-card rounded-2xl p-8 animate-fade-in-up relative overflow-hidden">
        <!-- Decorative background blob -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-500/20 rounded-full blur-3xl"></div>

        <!-- Header -->
        <div class="text-center mb-8 relative z-10">
          <div
            class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-100 dark:bg-primary-900/30 text-primary-600 mb-4">
            <i class="fa-solid fa-right-to-bracket text-xl"></i>
          </div>
          <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Welcome Back</h2>
          <p class="text-gray-500 dark:text-gray-400">Sign in to continue to ContactCore</p>
        </div>

        <!-- Message Box -->
        <div data-th-replace="~{message::messagebox}"></div>

        <div
          class="text-red-500 text-center mb-4 text-sm bg-red-100 dark:bg-red-900/30 p-2 rounded-lg border border-red-200 dark:border-red-900"
          th:if="${param.error}">
          Invalid username or password.
        </div>
        <div
          class="text-green-500 text-center mb-4 text-sm bg-green-100 dark:bg-green-900/30 p-2 rounded-lg border border-green-200 dark:border-green-900"
          th:if="${param.logout}">
          You have been logged out.
        </div>

        <!-- Form -->
        <form method="post" data-th-action="@{'/authenticate'}" class="space-y-5 relative z-10">

          <div>
            <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email
              Address</label>
            <div class="relative">
              <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none text-gray-400">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <input type="email" name="email" id="email"
                class="auth-input bg-gray-50/50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full ps-10 p-3 dark:bg-gray-700/50 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="name@company.com" required />
            </div>
          </div>

          <div>
            <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none text-gray-400">
                <i class="fa-solid fa-lock"></i>
              </div>
              <input type="password" name="password" id="password"
                class="auth-input bg-gray-50/50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full ps-10 p-3 dark:bg-gray-700/50 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="••••••••" required />
            </div>
          </div>

          <div class="flex items-center justify-between">
            <a href="#"
              class="text-sm font-medium text-primary-600 hover:text-primary-500 dark:text-primary-400 dark:hover:text-primary-300 transition-colors">Forgot
              password?</a>
          </div>

          <div class="flex gap-4">
            <button type="submit"
              class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-xl text-sm px-5 py-3 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800 transition-all shadow-lg shadow-primary-500/30 hover:shadow-primary-500/40 hover:-translate-y-0.5">
              Sign In
            </button>
            <button type="reset"
              class="w-1/3 text-gray-900 bg-white border border-gray-300 focus:outline-none hover:bg-gray-50 focus:ring-4 focus:ring-gray-200 font-medium rounded-xl text-sm px-5 py-3 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700 transition-all hover:-translate-y-0.5">
              Reset
            </button>
          </div>

        </form>

        <!-- Divider -->
        <div
          class="my-6 flex items-center before:mt-0.5 before:flex-1 before:border-t before:border-gray-300 after:mt-0.5 after:flex-1 after:border-t after:border-gray-300 dark:before:border-gray-700 dark:after:border-gray-700 relative z-10">
          <p class="mx-4 mb-0 text-center font-semibold text-gray-500 dark:text-gray-400 text-sm">OR</p>
        </div>

        <!-- Social Login -->
        <div class="space-y-3 relative z-10">
          <div class="grid grid-cols-2 gap-3">
            <a data-th-href="@{'/oauth2/authorization/google'}"
              class="flex items-center justify-center w-full px-4 py-2.5 text-gray-900 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 focus:ring-4 focus:outline-none focus:ring-gray-200 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 transition-all shadow-sm group hover:-translate-y-0.5">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg"
                class="h-5 w-5 mr-2 group-hover:scale-110 transition-transform" alt="Google">
              <span class="font-medium text-sm">Google</span>
            </a>

            <a data-th-href="@{'/oauth2/authorization/github'}"
              class="flex items-center justify-center w-full px-4 py-2.5 text-white bg-[#24292F] hover:bg-[#24292F]/90 focus:ring-4 focus:outline-none focus:ring-[#24292F]/50 font-medium rounded-xl text-sm dark:focus:ring-gray-500 dark:hover:bg-[#050708]/30 transition-all shadow-lg shadow-gray-500/30 group hover:-translate-y-0.5">
              <i class="fa-brands fa-github text-lg mr-2 group-hover:scale-110 transition-transform"></i>
              <span>GitHub</span>
            </a>
          </div>

          <!-- Guest Access Button -->
          <a data-th-href="@{'/guest-login'}"
            class="flex items-center justify-center w-full px-4 py-3 text-gray-700 bg-gradient-to-r from-gray-100 to-gray-200 hover:from-gray-200 hover:to-gray-300 dark:from-gray-700 dark:to-gray-800 dark:hover:from-gray-600 dark:hover:to-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-4 focus:outline-none focus:ring-gray-200 dark:focus:ring-gray-600 font-medium text-sm transition-all shadow-md group hover:-translate-y-0.5 hover:shadow-lg">
            <div class="p-1 bg-white/20 rounded-full mr-3">
              <i class="fa-solid fa-user-secret text-lg group-hover:scale-110 transition-transform"></i>
            </div>
            <span class="dark:text-white">Continue as Guest (Full Access)</span>
          </a>
        </div>

        <div class="mt-8 text-center relative z-10">
          <p class="text-sm text-gray-500 dark:text-gray-400">
            Don't have an account?
            <a data-th-href="@{'/register'}"
              class="font-medium text-primary-600 hover:underline dark:text-primary-500 transition-colors">Sign up
              now</a>
          </p>
        </div>

      </div>
    </div>
  </div>
  <script>
    console.log("Login page");
  </script>
</body>

</html>
